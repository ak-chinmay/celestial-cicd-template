name: Celestial CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to verify
        required: true
        type: string
      upload_artifact:
        description: Upload the verified production artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: celestial-ci-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify exact source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run project verification contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: ./ci/run verify

      - name: Upload exact verified artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: celestial-production-${{ inputs.ref }}
          path: .ci/artifact/
          if-no-files-found: error
          retention-days: 7
