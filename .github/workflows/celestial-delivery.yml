name: Celestial delivery

on:
  push:
    branches:
      - __CELESTIAL_DEFAULT_BRANCH__
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full lowercase commit SHA reachable from the default branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: celestial-production
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve delivery commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate exact target
        id: target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.target_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target_sha=$MANUAL_SHA
          else
            target_sha=$PUSH_SHA
          fi

          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Delivery target must be a full lowercase commit SHA." >&2
            exit 1
          fi

          git fetch --force origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$target_sha" "origin/$DEFAULT_BRANCH"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify delivery artifact
    needs: resolve
    uses: ./.github/workflows/celestial-ci.yml
    with:
      ref: ${{ needs.resolve.outputs.target_sha }}
      upload_artifact: true

  notification-configuration:
    name: Validate optional notifications
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out trusted notification client
        if: vars.NOTIFICATIONS_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Telegram access
        if: vars.NOTIFICATIONS_ENABLED == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 ci/notify.py --check

  release_context:
    name: Resolve release context
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      labels: ${{ steps.context.outputs.labels }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      pr_title: ${{ steps.context.outputs.pr_title }}
      status: ${{ steps.context.outputs.status }}
    steps:
      - name: Resolve merged pull request
        id: context
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: |
          pulls=$(gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/pulls?per_page=100")

          if ! jq -e 'type == "array"' >/dev/null <<< "$pulls"; then
            echo "GitHub returned an invalid pull request response." >&2
            exit 1
          fi

          matches=$(jq -c \
            --arg sha "$TARGET_SHA" \
            --arg base "$DEFAULT_BRANCH" \
            '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == $base)] | unique_by(.number)' \
            <<< "$pulls")
          match_count=$(jq 'length' <<< "$matches")

          if [[ "$match_count" -ne 1 ]]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "Release skipped: expected one merged pull request for $TARGET_SHA, found $match_count." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pr_title=$(jq -r '.[0].title' <<< "$matches")
          if [[ -z "$pr_title" || "$pr_title" == *$'\n'* || "$pr_title" == *$'\r'* ]]; then
            echo "Merged pull request title is missing or malformed." >&2
            exit 1
          fi

          echo "labels=$(jq -c '[.[0].labels[].name]' <<< "$matches")" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(jq -r '.[0].number' <<< "$matches")" >> "$GITHUB_OUTPUT"
          echo "pr_title=$pr_title" >> "$GITHUB_OUTPUT"
          echo "status=ready" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy exact verified artifact
    needs:
      - resolve
      - verify
      - notification-configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check out exact source for smoke adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}

      - name: Download exact verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: celestial-production-${{ needs.resolve.outputs.target_sha }}
          path: .ci/artifact/

      - name: Set up Node for pinned deployment client
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
          CLOUDFLARE_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PRODUCTION_BRANCH }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          [[ "$CLOUDFLARE_PROJECT" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,57}$ ]]
          git check-ref-format --branch "$CLOUDFLARE_PRODUCTION_BRANCH" >/dev/null
          [[ "$PRODUCTION_URL" =~ ^https://[^[:space:]]+$ ]]

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
          CLOUDFLARE_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PRODUCTION_BRANCH }}
        run: >-
          npx --yes wrangler@4.43.0 pages deploy .ci/artifact
          --project-name "$CLOUDFLARE_PROJECT"
          --branch "$CLOUDFLARE_PRODUCTION_BRANCH"

      - name: Smoke-test production
        env:
          CELESTIAL_SMOKE_MARKERS: ${{ vars.SMOKE_MARKERS }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: ./ci/run smoke "$PRODUCTION_URL"

  release:
    name: Publish GitHub release
    needs:
      - resolve
      - deploy
      - release_context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      created: ${{ steps.publish.outputs.created }}
      release_url: ${{ steps.publish.outputs.release_url }}
      status: ${{ steps.publish.outputs.status || needs.release_context.outputs.status }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out exact release target
        if: needs.release_context.outputs.status == 'ready'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.target_sha }}

      - name: Select idempotent semantic version
        if: needs.release_context.outputs.status == 'ready'
        id: version
        env:
          PR_LABELS_JSON: ${{ needs.release_context.outputs.labels }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: |
          version=$(python3 ci/release_version.py \
            --target-sha "$TARGET_SHA" \
            --labels-json "$PR_LABELS_JSON")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or reuse GitHub release
        if: needs.release_context.outputs.status == 'ready'
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ needs.release_context.outputs.pr_title }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing_tag_sha=$(git rev-list -n 1 "$VERSION" 2>/dev/null || true)
          if [[ -n "$existing_tag_sha" && "$existing_tag_sha" != "$TARGET_SHA" ]]; then
            echo "$VERSION already points to another commit." >&2
            exit 1
          fi

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_url=$(gh release view "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --json url \
              --jq .url)
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
            echo "status=existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$existing_tag_sha" ]]; then
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$PR_TITLE" \
              --generate-notes
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "$PR_TITLE" \
              --generate-notes
          fi

          release_url=$(gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --json url \
            --jq .url)
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          echo "status=created" >> "$GITHUB_OUTPUT"

  notify-success:
    name: Notify delivery success
    needs:
      - resolve
      - deploy
      - release_context
      - release
    if: vars.NOTIFICATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted notification client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Send bounded success notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_NUMBER: ${{ needs.release_context.outputs.pr_number }}
          PR_TITLE: ${{ needs.release_context.outputs.pr_title }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RELEASE_STATUS: ${{ needs.release.outputs.status }}
          RELEASE_URL: ${{ needs.release.outputs.release_url }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [[ -n "$PR_TITLE" ]]; then
            pr_display="#$PR_NUMBER — $PR_TITLE"
          else
            pr_display="Unavailable (no unique merged pull request)"
          fi

          if [[ -n "$RELEASE_URL" ]]; then
            release_display="$RELEASE_VERSION — $RELEASE_URL"
          elif [[ "$RELEASE_STATUS" == "skipped" ]]; then
            release_display="Skipped (no unique merged pull request)"
          else
            release_display="Not published"
          fi

          production_display=${PRODUCTION_URL:-Unavailable}
          message=$(printf '%s\nPR: %s\nRelease: %s\nProduction: %s' \
            "✅ Production delivery succeeded — $GITHUB_REPOSITORY" \
            "$pr_display" \
            "$release_display" \
            "$production_display")
          python3 ci/notify.py --message "$message"

  notify-failure:
    name: Notify delivery failure
    needs:
      - resolve
      - verify
      - notification-configuration
      - deploy
      - release_context
      - release
      - notify-success
    if: >-
      always() &&
      vars.NOTIFICATIONS_ENABLED == 'true' &&
      (needs.resolve.result == 'failure' ||
      needs.verify.result == 'failure' ||
      needs.notification-configuration.result == 'failure' ||
      needs.deploy.result == 'failure' ||
      needs.release_context.result == 'failure' ||
      needs.release.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted notification client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Send bounded failure notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_NUMBER: ${{ needs.release_context.outputs.pr_number }}
          PR_TITLE: ${{ needs.release_context.outputs.pr_title }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          RELEASE_STATUS: ${{ needs.release.outputs.status }}
          RELEASE_URL: ${{ needs.release.outputs.release_url }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -n "$PR_TITLE" ]]; then
            pr_display="#$PR_NUMBER — $PR_TITLE"
          else
            pr_display="Unavailable"
          fi

          if [[ -n "$RELEASE_URL" ]]; then
            release_display="$RELEASE_VERSION — $RELEASE_URL"
          elif [[ "$RELEASE_STATUS" == "skipped" ]]; then
            release_display="Skipped (no unique merged pull request)"
          elif [[ -n "$RELEASE_VERSION" ]]; then
            release_display="$RELEASE_VERSION (not published)"
          else
            release_display="Not published"
          fi

          production_display=${PRODUCTION_URL:-Unavailable}
          message=$(printf '%s\nPR: %s\nRelease: %s\nProduction: %s\nRun: %s' \
            "❌ Production delivery failed — $GITHUB_REPOSITORY" \
            "$pr_display" \
            "$release_display" \
            "$production_display" \
            "$RUN_URL")
          python3 ci/notify.py --message "$message"
