name: Celestial production monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Exercise one notification transition
        required: false
        default: none
        type: choice
        options:
          - none
          - failure
          - recovery

permissions:
  actions: read
  contents: read

concurrency:
  group: celestial-production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out smoke and notification clients
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Smoke-test production
        id: smoke
        continue-on-error: true
        env:
          CELESTIAL_SMOKE_MARKERS: ${{ vars.SMOKE_MARKERS }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: ./ci/run smoke "$PRODUCTION_URL"

      - name: Resolve last committed monitor state
        id: transition
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RESULT: ${{ steps.smoke.outcome }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TEST_ALERT: ${{ inputs.test_alert || 'none' }}
        run: |
          previous=unknown
          artifact_ids="$RUNNER_TEMP/monitor-state-artifact-ids"
          gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name=celestial-monitor-state \
            -f per_page=100 | \
            jq --arg branch "$DEFAULT_BRANCH" -r \
              '[.[] | .artifacts[] | select(.expired == false and .workflow_run.head_branch == $branch)] | sort_by(.created_at) | reverse | .[].id' \
              > "$artifact_ids"

          while read -r artifact_id; do
            archive="$RUNNER_TEMP/monitor-state-$artifact_id.zip"
            if gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$archive" 2>/dev/null; then
              candidate=$(python3 ci/read_monitor_state.py "$archive") || continue
              previous=$candidate
              break
            fi
          done < "$artifact_ids"

          current=failure
          [[ "$CURRENT_RESULT" == "success" ]] && current=success
          transition=none
          if [[ "$TEST_ALERT" == "failure" ]]; then
            transition=failure
          elif [[ "$TEST_ALERT" == "recovery" ]]; then
            transition=recovery
          elif [[ "$current" == "failure" && "$previous" != "failure" ]]; then
            transition=failure
          elif [[ "$current" == "success" && "$previous" == "failure" ]]; then
            transition=recovery
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "value=$transition" >> "$GITHUB_OUTPUT"

      - name: Validate Telegram access
        if: vars.NOTIFICATIONS_ENABLED == 'true' && steps.transition.outputs.value != 'none'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 ci/notify.py --check

      - name: Notify failure transition
        if: vars.NOTIFICATIONS_ENABLED == 'true' && steps.transition.outputs.value == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: >-
            ❌ Production monitoring entered failure for ${{ github.repository }}.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 ci/notify.py --message "$MESSAGE"

      - name: Notify recovery transition
        if: vars.NOTIFICATIONS_ENABLED == 'true' && steps.transition.outputs.value == 'recovery'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ✅ Production monitoring recovered for ${{ github.repository }}.
        run: python3 ci/notify.py --message "$MESSAGE"

      - name: Write committed monitor state
        if: (inputs.test_alert || 'none') == 'none'
        run: |
          mkdir -p "$RUNNER_TEMP/current-monitor-state"
          echo "${{ steps.transition.outputs.current }}" > "$RUNNER_TEMP/current-monitor-state/state"

      - name: Persist committed monitor state
        if: (inputs.test_alert || 'none') == 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: celestial-monitor-state
          path: ${{ runner.temp }}/current-monitor-state/state
          if-no-files-found: error
          retention-days: 90

      - name: Preserve monitor failure status
        if: steps.smoke.outcome != 'success' && (inputs.test_alert || 'none') == 'none'
        run: exit 1
