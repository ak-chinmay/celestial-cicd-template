name: Template self-test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate manifest and contracts
        run: |
          python3 scripts/build_manifest.py
          git diff --exit-code -- .celestial/cicd-template-manifest.json
          python3 -m unittest discover -s tests -v
          bash -n ci/run
          python3 -m py_compile ci/notify.py ci/read_monitor_state.py ci/release_version.py ci/validate_requirements.py scripts/build_manifest.py scripts/render_workflow_variants.py tests/test_release_version.py tests/test_template.py

      - name: Lint raw and adversarially rendered workflows
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          python3 scripts/render_workflow_variants.py "$RUNNER_TEMP/rendered-workflows"
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml "$RUNNER_TEMP"/rendered-workflows/*.yml
